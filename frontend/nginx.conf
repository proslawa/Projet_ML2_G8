server {
    listen 80;
    server_name localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Redirige toutes les requêtes non trouvées vers index.html (pour React Router)
        try_files $uri $uri/ /index.html;
    }

    # Redirection des erreurs serveur vers une page d'erreur (optionnel)
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# Configuration MLflow — Bank Churn G8
# URI locale : les runs sont stockés dans <projet>/mlruns/
# Pour visualiser : mlflow ui --port 5000  →  http://127.0.0.1:5000

tracking:
  enabled: true
  uri: "file:./mlruns"
  experiment_name: "churn_score"
  artifact_location: "mlruns"

run:
  default_name: "bank_churn_run"
  tags:
    project: "bank_churn_ml"
    stage: "dev"
    owner: "team_g8"
    pipeline: "modelisation"

logging:
  log_full_config: true
  config_sections:
    - data
    - feature_engineering
    - mlflow
